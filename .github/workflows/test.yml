name: Tests

on: [push, pull_request]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m pytest --cov=sfu_converter --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=100
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-windows-py3.12
          path: coverage.xml
